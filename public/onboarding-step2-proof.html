<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Maak — أسفل الخطوة 2 (clearance)</title>
<style>
:root{--bg-2:#eef0f3;--surface:#fff;--surface-2:#f7f8fa;--hair:#ececec;--hair-2:#e7e8ec;--text:#14161c;--text-soft:#6b7280;--gold:#b8860b;--gold-bright:#e0a93b;--gold-soft:#fbf3df;--radius-lg:18px;--shadow-sm:0 4px 14px rgba(20,22,28,.06);--ring:0 0 0 3px rgba(184,134,11,.18)}
*{box-sizing:border-box}
body{margin:0;font-family:ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg-2);color:var(--text);max-width:430px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:50;background:var(--surface);border-bottom:1px solid var(--hair);height:52px;display:flex;align-items:center;padding:0 14px;justify-content:space-between}
.topbar .logo{font-weight:800;color:var(--gold)}
.topbar .avatar{width:30px;height:30px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:13px}
.proof-tag{display:block;text-align:center;font-size:11px;font-weight:700;color:var(--text-soft);background:#fff;border-bottom:1px solid var(--hair);padding:7px}
.screen{width:100%;padding:16px}
.page-title{padding:2px 0 10px}
.page-title h1{margin:4px 0 0;font-size:20px;font-weight:800}
.section-kicker{font-size:11px;font-weight:800;color:var(--gold)}
.onb-progress{display:flex;gap:8px;margin:0 0 14px}
.onb-step{display:flex;align-items:center;gap:8px;flex:1;padding:8px;border-radius:14px;background:var(--surface);border:1px solid var(--hair)}
.onb-step.active{border-color:var(--gold);box-shadow:var(--ring)}
.onb-step.done{opacity:.7}
.onb-step-dot{width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:var(--surface-2);color:var(--text-soft);font-size:12px;font-weight:800}
.onb-step.active .onb-step-dot{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1408}
.onb-step.done .onb-step-dot{background:#e7f6ec;color:#1f9d57}
.onb-step-label{font-size:10.5px;font-weight:700;color:var(--text-soft)}
.onb-step.active .onb-step-label{color:var(--text)}
.onb-step-card{background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--hair-2);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-sm)}
.onb-step-title{margin:0 0 4px;font-size:18px;font-weight:800}
.onb-step-sub{margin:0 0 14px;color:var(--text-soft);font-size:12px;line-height:1.6}
.onb-ellipsis{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.onb-ellipsis .dot{height:9px;width:100%;background:var(--surface-2);border:1px solid var(--hair-2);border-radius:8px}
.onb-field{display:flex;flex-direction:column;gap:7px}
.onb-field>span{color:var(--text-soft);font-size:12px;font-weight:600}
.field{width:100%;border:1px solid var(--hair-2);border-radius:12px;padding:12px 14px;font-size:14px;background:var(--surface);color:var(--text)}
.onb-nav{display:flex;gap:12px;margin-top:18px}
.onb-nav .secondary,.onb-nav .primary{flex:1}
.primary,.secondary{border-radius:14px;padding:15px 18px;font-size:15px;font-weight:800;cursor:pointer;border:1px solid transparent}
.primary{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#1a1408}
.secondary{background:var(--surface-2);color:var(--text);border-color:var(--hair-2)}
/* الإصلاح (commit 80a1395c) */
.onb-nav{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;z-index:30;justify-content:space-around;align-items:center;height:64px;background:var(--surface);border-top:1px solid var(--hair)}
.mobile-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;background:none;border:0;color:var(--text-soft);font-size:10.5px;font-weight:700;padding:8px 2px}
.mobile-nav button .ic{width:20px;height:20px;display:grid;place-items:center;font-size:15px}
.mobile-nav button.active{color:var(--gold)}
.clearance-note{position:fixed;bottom:70px;left:0;right:0;max-width:430px;margin:0 auto;text-align:center;font-size:10px;font-weight:700;color:var(--text-soft);z-index:20;padding:0 16px}
</style></head><body>
<div class="topbar"><span class="logo">معك</span><span class="avatar">M</span></div>
<span class="proof-tag">أسفل الخطوة 2 — إثبات ظهور زرّ «التالي» بالكامل فوق شريط التنقل الثابت</span>
<main class="screen">
  <div class="onb-progress">
    <div class="onb-step done"><span class="onb-step-dot">✓</span></div>
    <div class="onb-step active"><span class="onb-step-dot">2</span><span class="onb-step-label">البيانات المهنية</span></div>
    <div class="onb-step"><span class="onb-step-dot">3</span></div>
    <div class="onb-step"><span class="onb-step-dot">4</span></div>
  </div>
  <div class="onb-step-card">
    <h2 class="onb-step-title">البيانات المهنية</h2>
    <p class="onb-step-sub">… أسفل الحقول المهنية …</p>
    <div class="onb-ellipsis"><div class="dot"></div><div class="dot"></div><div class="dot" style="height:34px"></div></div>
    <label class="onb-field"><span>نطاق العمل (كم) (اختياري)</span><input class="field" inputmode="numeric" placeholder="مثال: 10"></label>
  </div>
  <div class="onb-nav">
    <button class="secondary" type="button">السابق</button>
    <button class="primary" type="button">التالي</button>
  </div>
</main>
<div class="clearance-note">↕ clearance 88px فوق شريط التنقل</div>
<nav class="mobile-nav">
  <button><span class="ic">⌂</span><span>الرئيسية</span></button>
  <button><span class="ic">⌕</span><span>اكتشف</span></button>
  <button class="active"><span class="ic">✎</span><span>الحجوزات</span></button>
  <button><span class="ic">✉</span><span>الرسائل</span></button>
  <button><span class="ic">☺</span><span>حسابي</span></button>
</nav>
</body></html>
