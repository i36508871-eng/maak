app = "maak-api"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = 5

[build]

[env]
MAAK_PORT = "8080"
MAAK_DB_PATH = "/data/maak.db"
MAAK_ALLOW_ORIGIN = "https://i36508871-eng.github.io"

[[mounts]]
source = "maak_data"
destination = "/data"

[http_service]
internal_port = 8080
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "10s"
method = "GET"
path = "/health"
